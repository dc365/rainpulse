name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: services/control/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.10"
          enable-cache: true
          cache-dependency-glob: algorithms/uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: uv tool install ruff==0.15.12
      - name: Bootstrap
        run: make bootstrap
      - name: Test
        run: make test
      - name: Lint
        run: make lint
      - name: Build
        run: make build
