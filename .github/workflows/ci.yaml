name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [test, lint, build, test-prelaunch, test-qc-opensource, test-qc-rfi-objects, test-qc-v3]
    steps:
      - uses: actions/checkout@v5
      - name: Install system test tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: services/control/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.10"
          enable-cache: true
          cache-dependency-glob: algorithms/uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: uv tool install ruff==0.15.12
      - name: Bootstrap
        run: make bootstrap
      - name: Verify
        run: make ${{ matrix.target }}
  verify:
    name: verify
    runs-on: ubuntu-latest
    needs: [checks]
    if: always()
    steps:
      - name: Require every independent check
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success
