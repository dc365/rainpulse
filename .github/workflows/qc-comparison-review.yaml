name: qc-comparison-review
on:
  push:
    branches: ['feature/qc-afl-rdd-fusion-20260913']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public journal table of contents and resolve exact title
        shell: python
        run: |
          import concurrent.futures, json, os, pathlib, re, urllib.request, urllib.parse
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'qc-comparison'
          root.mkdir()
          receipts = []
          base = 'http://rdqx.ijournals.cn/'
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read(10000000)
                  receipts.append({'url':url,'final_url':response.url,'bytes':len(body)})
                  return body
          def entry(number):
              url = base+'ch/reader/view_abstract.aspx?file_no=202206%02d&flag=1'%number
              try:
                  body = get(url)
                  text = body.decode('utf-8',errors='replace')
                  title = re.search(r'<title>(.*?)</title>',text,re.S)
                  title = title.group(1) if title else ''
                  if '基于数据特征' in title:
                      (root/'rdd-article.html').write_bytes(body)
                      links = re.findall(r'href\s*=\s*[\"\x27]([^\"\x27]+)',text,re.I)
                      for i, link in enumerate(links):
                          if 'create_pdf' in link or ('2022/6' in link and '.htm' in link):
                              target=urllib.parse.urljoin(url,link.replace('&amp;','&'))
                              try:
                                  content=get(target)
                                  (root/('rdd-full-%s'%i+('.pdf' if content.startswith(b'%PDF') else '.html'))).write_bytes(content)
                              except Exception as error: receipts.append({'url':target,'error':str(error)})
                  return {'number':number,'title':title}
              except Exception as error: return {'number':number,'error':str(error)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              titles=list(pool.map(entry,range(1,17)))
          (root/'titles.json').write_text(json.dumps(titles,ensure_ascii=False,indent=2))
          (root/'publisher-receipts.json').write_text(json.dumps(receipts,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: rainpulse-qc-comparison-source
          path: ${{ runner.temp }}/qc-comparison
          retention-days: 7
          if-no-files-found: error
