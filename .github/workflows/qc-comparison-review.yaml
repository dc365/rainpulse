name: qc-comparison-review
on:
  push:
    branches: ['feature/qc-afl-rdd-fusion-20260913']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public paper static sources
        shell: python
        run: |
          import concurrent.futures, json, os, pathlib, urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'qc-comparison'; root.mkdir()
          urls=[
            'https://html.rhhz.net/rdqxxb/html/2022/6/20220603.htm',
            'http://rdqx.ijournals.cn/html/2022/20220603.htm',
            'http://rdqx.ijournals.cn/UploadFile/Issue/202212190001/2022/6/20220603.pdf',
            'http://rdqx.ijournals.cn/download_upload_file.aspx?file_name=/uploadfile/rdqx/2022/6/20220603.pdf',
            'https://rdqxxb.itmm.org.cn/article/exportPdf?id=10.16032/j.issn.1004-4965.2022.073',
            'https://rdqxxb.itmm.org.cn/fileRDQXXB_CN/journal/article/rdqxxb/2022/6/PDF/20220603.pdf',
          ]
          def get(item):
            i,url=item
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=20) as res:
                body=res.read(12000000)
                path='source-'+str(i)+('.pdf' if body.startswith(b'%PDF') else '.html')
                (root/path).write_bytes(body)
                return {'url':url,'path':path,'bytes':len(body),'final_url':res.url}
            except Exception as error:return {'url':url,'error':str(error)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool: results=list(pool.map(get,enumerate(urls)))
          (root/'publisher-receipts.json').write_text(json.dumps(results,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: rainpulse-qc-comparison-source
          path: ${{ runner.temp }}/qc-comparison
          retention-days: 7
          if-no-files-found: error
