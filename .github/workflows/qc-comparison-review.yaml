name: qc-comparison-review
on:
  push:
    branches: ['feature/qc-afl-rdd-fusion-20260913']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Export exact source for isolated comparison review
        run: |
          mkdir -p "$RUNNER_TEMP/qc-comparison"
          git bundle create "$RUNNER_TEMP/qc-comparison/source.bundle" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/qc-comparison/head.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: rainpulse-qc-comparison-source
          path: ${{ runner.temp }}/qc-comparison
          retention-days: 7
          if-no-files-found: error
