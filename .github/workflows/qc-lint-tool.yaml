name: qc-lint-tool
on:
  push:
    branches: ['feature/radar-qc-opensource-20260911']
    paths: ['.github/workflows/qc-lint-tool.yaml']
permissions:
  contents: read
jobs:
  tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --target "$RUNNER_TEMP/ruff-tool" ruff==0.15.12
      - uses: actions/upload-artifact@v4
        with:
          name: qc-ruff
          path: ${{ runner.temp }}/ruff-tool/bin/ruff
          retention-days: 1
          if-no-files-found: error
