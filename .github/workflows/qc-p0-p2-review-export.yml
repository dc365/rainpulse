name: QC P0-P2 review export
on:
  push:
    branches: ['review/qc-p0-p2-20260917']
    paths: ['.github/workflows/qc-p0-p2-review-export.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c3e7680478c3df3fe7a609b267e10a7bcccce455
          fetch-depth: 0
          persist-credentials: false
      - run: |
          mkdir -p /tmp/export
          git archive --format=tar HEAD | gzip > /tmp/export/source.tar.gz
          git bundle create /tmp/export/source.bundle HEAD
          git rev-parse HEAD HEAD^{tree} > /tmp/export/identity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qc-p0-p2-source
          path: /tmp/export
          retention-days: 2
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c3e7680478c3df3fe7a609b267e10a7bcccce455
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: |
          mkdir -p /tmp/export /tmp/pysite
          uv export --project algorithms --locked --no-emit-project --no-hashes --format requirements-txt > /tmp/export/requirements.txt
          python -m pip install --target /tmp/pysite -r /tmp/export/requirements.txt ruff
          PYTHONPATH=/tmp/pysite PYART_QUIET=1 python -c 'import pyart,wradlib,numpy,scipy,zarr; print(pyart.__version__,wradlib.__version__,numpy.__version__,scipy.__version__,zarr.__version__)' > /tmp/export/import-proof.txt
          tar czf /tmp/export/python.tar.gz -C /tmp/pysite .
      - uses: actions/upload-artifact@v4
        with:
          name: qc-p0-p2-python
          path: /tmp/export
          retention-days: 2
