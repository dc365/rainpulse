name: QC P012 offline review assets
on:
  push:
    branches: [review/qc-p012-build-assets-20260916]
    paths: [.github/workflows/qc-p012-review-assets.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c3e7680478c3df3fe7a609b267e10a7bcccce455
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Source and review dependencies (no private observations)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline-assets
          git archive --format=tar.gz --output=offline-assets/source.tar.gz HEAD
          git rev-parse HEAD HEAD^{tree} > offline-assets/source-identity.txt
          python -m pip install --target /tmp/qc-site 'arm-pyart==2.2.5' 'wradlib==2.9.5' 'zarr==2.18.7' 'pydantic>=2.13,<3' 'numpy<3' 'scipy<2' 'minio>=7.2.20,<8' 'nats-py>=2.15,<3' 'pysteps==1.21.5' 'opencv-python-headless==5.0.0.93' 'pytest>=8.3,<9' 'jsonschema>=4.25,<5' 'ruff' 'rasterio>=1.4.3,<2' 'pyshp>=2.3.1,<3' 'shapely>=2.1,<3'
          PYTHONPATH=/tmp/qc-site python -c "import sys,pyart,wradlib,zarr,numpy,scipy; print(sys.version); print(pyart.__version__,wradlib.__version__,zarr.__version__,numpy.__version__,scipy.__version__)" > offline-assets/import-proof.txt
          tar -czf offline-assets/python-site.tar.gz -C /tmp/qc-site .
          sha256sum offline-assets/*.tar.gz > offline-assets/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rainpulse-p012-offline-review
          path: offline-assets/
          retention-days: 3
          compression-level: 0
