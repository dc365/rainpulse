name: qc-review-toolkit
on:
  workflow_dispatch:
  push:
    branches: ['feature/radar-qc-opensource-20260911']
    paths: ['.github/workflows/qc-review-toolkit.yaml']
permissions:
  contents: read
jobs:
  toolkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Archive exact source
        run: |
          mkdir -p "$RUNNER_TEMP/qc-review"
          git archive --format=zip --output="$RUNNER_TEMP/qc-review/source.zip" HEAD
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.10'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: services/control/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: '11.10.0'
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prepare locked QC dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qc-python"
          uv add --project algorithms --no-sync 'arm_pyart==2.2.5' 'wradlib==2.9.5'
          uv export --project algorithms --locked --no-emit-project --format requirements.txt > "$RUNNER_TEMP/qc-review/requirements.txt"
          cp algorithms/pyproject.toml algorithms/uv.lock "$RUNNER_TEMP/qc-review/"
          python -m pip install --target "$RUNNER_TEMP/qc-python" --report "$RUNNER_TEMP/qc-review/install-report.json" -r "$RUNNER_TEMP/qc-review/requirements.txt"
          python -m pip install --target "$RUNNER_TEMP/qc-python" ruff==0.15.12
          tar -czf "$RUNNER_TEMP/qc-review/python.tar.gz" -C "$RUNNER_TEMP/qc-python" .
          PYTHONPATH="$RUNNER_TEMP/qc-python" python -c 'import pyart, wradlib; print(pyart.__version__, wradlib.__version__)' > "$RUNNER_TEMP/qc-review/import-proof.txt"
      - name: Prepare Go and Web verification tools
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/go_control.sh list -buildvcs=false -deps ./... >/dev/null
          tar -czf "$RUNNER_TEMP/qc-review/go.tar.gz" -C "$(go env GOROOT)" .
          tar -czf "$RUNNER_TEMP/qc-review/gomod.tar.gz" -C "$(go env GOMODCACHE)" .
          pnpm install --frozen-lockfile
          tar -czf "$RUNNER_TEMP/qc-review/web.tar.gz" node_modules apps/web/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainpulse-qc-review-toolkit
          path: ${{ runner.temp }}/qc-review/
          retention-days: 7
          if-no-files-found: error
