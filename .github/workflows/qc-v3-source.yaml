name: qc-v3-source
on:
  push:
    branches: ['feature/qc-v3-20260913']
    paths: ['.github/workflows/qc-v3-source.yaml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 1251ea8fc8b628e48baf9ccaf28fd9349d3fb991
          persist-credentials: false
      - run: git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: rainpulse-v3-baseline
          path: ${{ runner.temp }}/source.zip
          retention-days: 7
          if-no-files-found: error
