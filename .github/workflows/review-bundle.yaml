name: review-bundle

on:
  push:
    branches:
      - 'improvement/**'
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Archive exact review source
        run: git archive --format=zip --output="$RUNNER_TEMP/rainpulse-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: rainpulse-review-source
          path: ${{ runner.temp }}/rainpulse-source.zip
          retention-days: 7
          if-no-files-found: error
