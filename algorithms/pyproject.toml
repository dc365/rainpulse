[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rainpulse-algo"
version = "0.1.0"
description = "RainPulse compute-plane package and worker framework"
requires-python = ">=3.11"
dependencies = [
  "minio>=7.2.20,<8",
  "nats-py>=2.15,<3",
  "numpy>=2.1,<3",
  "opencv-python-headless==5.0.0.93",
  "pydantic>=2.13,<3",
  "pyproj>=3.7,<4",
  "pyshp>=2.3.1,<3",
  "pysteps==1.21.5",
  "pyyaml>=6,<7",
  "rasterio>=1.4.3,<2",
  "scipy>=1.15,<2",
  "shapely>=2.1,<3",
  "zarr>=2.18.7,<3",
]

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5",
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["rainpulse_algo"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
