schema_version: "1.0"
profile_version: rp049-pysteps-steps-history-v5
model_id: pysteps-steps
model_version: pysteps-steps-0.4.0-history
pysteps_version: 1.21.5
nowcast_input_contract_version: "1.2"
forecast_output_contract_version: "1.2"

grid_id: fuzhou_118_123_25_27_0p01deg_v1
grid_config_version: fuzhou-grid-0p01deg-v1

sequence:
  minimum_frames: 3
  maximum_frames: 6
  timestep_minutes: 5

ensemble:
  member_count: 12
  random_seed: 20260829
  num_workers: 1
  cascade_levels: 6
  # Keep the validated sparse-domain configuration unchanged. This revision
  # changes only the publication support semantics.
  autoregressive_order: 1
  transformation: dB
  precipitation_threshold_mm_h: 0.1
  minimum_trackable_precipitation_pixels: 64
  decomposition_method: fft
  bandpass_filter_method: gaussian
  precipitation_noise_method: parametric
  noise_stddev_adjustment: none
  velocity_perturbation_method: bps
  probability_matching_method: cdf
  mask_method: incremental
  domain: spatial

support:
  input_missing_policy: dry_floor_working_copy_preserve_deterministic_support
  # A velocity-perturbed member can leave the finite compute domain earlier
  # than the deterministic trajectory. Preserve the deterministic support when
  # at least 75% of the members remain finite; never turn missing input into rain.
  output_support_policy: deterministic_support_minimum_members_finite
  minimum_valid_members: 9

probability_products:
  event_operator: greater_than
  calibration_status: raw_ensemble_relative_frequency_uncalibrated
  rain_rate_thresholds_mm_h: [1.0, 5.0, 10.0, 20.0, 50.0]
  quantiles: [0.1, 0.5, 0.9]
