schema_version: "1.0"
profile_version: rp042-fujian-evidence-v1
pipeline_version: rp042-fujian-evidence-1.0.0
flag_definition_version: qc-flags-v1

health_gate:
  reject_states: [UNAVAILABLE]
  degraded_quality_multiplier: 0.80

echo:
  dbzh_valid_range_dbz: [-32.0, 80.0]
  no_rain_below_dbz: -10.0
  low_snr_db: 3.0
  snr_meteo_range_db: [0.0, 12.0]
  rhohv_meteo_range: [0.70, 0.97]
  fallback_meteo_probability: 0.60

# The declared dual-polarisation moments exist in all four 2026-08-28 radar
# inventories, but their cross-radar calibration is not independently frozen.
# Publish a fuzzy diagnostic without changing the production QI in this version.
dual_pol_fuzzy:
  enabled: true
  mode: diagnostic_only
  zdr_plausible_range_db: [-2.0, 5.0]
  zdr_transition_db: 2.0
  phidp_step_range_deg: [3.0, 30.0]
  weights: {rhohv: 0.55, snr: 0.15, zdr: 0.15, phidp: 0.15}

# Adjacent elevation cuts are present in every available volume. Keep the
# result diagnostic-only until shallow precipitation cases are independently
# labelled; it may support radial evidence in a later profile version.
vertical_consistency:
  enabled: true
  mode: diagnostic_only
  minimum_dbzh: 10.0
  support_tolerance_db: 15.0
  maximum_range_m: 150000.0

radial_interference:
  minimum_valid_gate_fraction: 0.55
  minimum_consecutive_gates: 80
  neighbour_difference_db: 12.0
  low_quality_probability: 0.65
  flag_probability: 0.80
  morphology:
    enabled: true
    mode: diagnostic_only
    candidate_difference_db: 12.0
    minimum_segment_gates: 12
    intermittent_minimum_segments: 3
    short_range_max_m: 60000.0
    reverse_minimum_drop_db: 12.0
    diagnostic_probability: 0.65

static_ground_clutter:
  asset_uri: null
  asset_version: null
  flag_probability: 0.70

sea_ap:
  coastline_asset_uri: null
  asset_version: null
  flag_probability: 0.70

quality_index:
  aggregation: product
  components: [QI_METEO, QI_INTERFERENCE, QI_RANGE]
  minimum_range_quality: 0.92
  low_quality_threshold: 0.45
  unavailable_component_policy: skip_and_record
