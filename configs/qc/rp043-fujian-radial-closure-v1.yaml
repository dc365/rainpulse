schema_version: "1.0"
profile_version: rp043-fujian-radial-closure-v1
pipeline_version: rp043-fujian-radial-closure-1.0.0
flag_definition_version: qc-flags-v1

health_gate:
  reject_states: [UNAVAILABLE]
  degraded_quality_multiplier: 0.80

echo:
  dbzh_valid_range_dbz: [-32.0, 80.0]
  no_rain_below_dbz: -10.0
  low_snr_db: 3.0
  snr_meteo_range_db: [0.0, 12.0]
  rhohv_meteo_range: [0.70, 0.97]
  fallback_meteo_probability: 0.60

dual_pol_fuzzy:
  enabled: true
  mode: diagnostic_only
  zdr_plausible_range_db: [-2.0, 5.0]
  zdr_transition_db: 2.0
  phidp_step_range_deg: [3.0, 30.0]
  weights: {rhohv: 0.55, snr: 0.15, zdr: 0.15, phidp: 0.15}

vertical_consistency:
  enabled: true
  mode: diagnostic_only
  minimum_dbzh: 10.0
  support_tolerance_db: 15.0
  maximum_range_m: 150000.0

radial_interference:
  minimum_valid_gate_fraction: 0.55
  minimum_consecutive_gates: 80
  neighbour_difference_db: 12.0
  low_quality_probability: 0.65
  flag_probability: 0.80
  morphology:
    enabled: true
    mode: diagnostic_only
    candidate_difference_db: 12.0
    minimum_segment_gates: 12
    intermittent_minimum_segments: 3
    short_range_max_m: 60000.0
    reverse_minimum_drop_db: 12.0
    diagnostic_probability: 0.65
    # Fill only one- or two-ray gaps bounded by existing hard fan seeds. The
    # lower boundary signature is never used without those confirmed seeds.
    fan_closure:
      enabled: true
      maximum_gap_rays: 2
      minimum_valid_gate_fraction: 0.90
      minimum_high_dbzh: 45.0
      minimum_high_gate_fraction: 0.50
      minimum_high_run: 120
      minimum_range_growth_db: 20.0
    # Confirm sparse longitudinal evidence only when its short-window azimuth
    # discontinuity is stronger than the broad background window.
    multiscale_promotion:
      enabled: true
      echo_threshold_dbzh: 30.0
      short_window_rays: 4
      long_window_rays: 40
      minimum_score_gate_fraction: 0.02
      minimum_edge_jump_gate_fraction: 0.10
      minimum_diagnostic_gates: 100
      minimum_high_dbzh: 45.0
      minimum_high_gates: 100
      minimum_range_growth_db: 12.0

static_ground_clutter:
  asset_uri: null
  asset_version: null
  flag_probability: 0.70

sea_ap:
  coastline_asset_uri: null
  asset_version: null
  flag_probability: 0.70

quality_index:
  aggregation: product
  components: [QI_METEO, QI_INTERFERENCE, QI_RANGE]
  minimum_range_quality: 0.92
  low_quality_threshold: 0.45
  unavailable_component_policy: skip_and_record
