schema_version: "1.0"
profile_version: rp047-fujian-radial-evidence-v1
pipeline_version: rp047-fujian-radial-evidence-1.3.0
flag_definition_version: qc-flags-v1

health_gate:
  reject_states: [UNAVAILABLE]
  degraded_quality_multiplier: 0.80

echo:
  dbzh_valid_range_dbz: [-32.0, 80.0]
  no_rain_below_dbz: -10.0
  low_snr_db: 3.0
  snr_meteo_range_db: [0.0, 12.0]
  rhohv_meteo_range: [0.70, 0.97]
  fallback_meteo_probability: 0.60

dual_pol_fuzzy:
  enabled: true
  mode: diagnostic_only
  zdr_plausible_range_db: [-2.0, 5.0]
  zdr_transition_db: 2.0
  phidp_step_range_deg: [3.0, 30.0]
  weights: {rhohv: 0.55, snr: 0.15, zdr: 0.15, phidp: 0.15}

vertical_consistency:
  enabled: true
  mode: diagnostic_only
  minimum_dbzh: 10.0
  support_tolerance_db: 15.0
  maximum_range_m: 150000.0

radial_interference:
  minimum_valid_gate_fraction: 0.55
  minimum_consecutive_gates: 80
  neighbour_difference_db: 12.0
  low_quality_probability: 0.65
  flag_probability: 0.80
  morphology:
    enabled: true
    # Weak candidates participate in QI_INTERFERENCE even when the independent
    # evidence gate refuses a hard interference flag.
    mode: quality_index
    candidate_difference_db: 12.0
    minimum_segment_gates: 12
    intermittent_minimum_segments: 3
    short_range_max_m: 60000.0
    reverse_minimum_drop_db: 12.0
    diagnostic_probability: 0.65
    # Close short holes only inside a hard-seeded fan. Gap rays must still
    # reach the observed long-range boundary; this avoids filling rain bands.
    fan_closure:
      enabled: true
      extent_gap_enabled: true
      # Extend only one or two open fan-edge rays when their observed support
      # remains a long, high-occupancy, range-corrected-power-stable signal.
      edge_extension_enabled: true
      maximum_gap_rays: 4
      maximum_edge_rays: 2
      minimum_valid_gate_fraction: 0.90
      minimum_high_dbzh: 45.0
      minimum_high_gate_fraction: 0.50
      minimum_high_run: 120
      minimum_range_growth_db: 12.0
      minimum_gap_valid_gate_fraction: 0.50
      minimum_gap_consecutive_gates: 350
      minimum_gap_range_extent_fraction: 0.95
      minimum_gap_boundary_extent_ratio: 0.50
      minimum_edge_valid_gate_fraction: 0.55
      minimum_edge_range_extent_fraction: 0.55
      minimum_edge_boundary_extent_ratio: 0.55
      minimum_edge_high_gate_fraction: 0.30
      minimum_seed_fraction: 0.30
    # Promote a weak adjacent radial group only when its range-corrected power
    # is stable and the next reflectivity elevation does not support the echo.
    radial_extent_promotion:
      enabled: true
      minimum_valid_gate_fraction: 0.55
      diagnostic_minimum_valid_gate_fraction: 0.50
      minimum_consecutive_gates: 350
      minimum_range_extent_fraction: 0.95
      minimum_range_growth_db: 12.0
      minimum_analysis_range_m: 50000.0
      maximum_power_iqr_db: 5.0
      minimum_group_rays: 2
      maximum_group_rays: 8
      maximum_group_gap_rays: 1
      maximum_hard_seed_distance_rays: 8
      maximum_higher_elevation_extent_fraction: 0.40
    context_fusion:
      enabled: true
      minimum_independent_evidence: 2
      minimum_temporal_context_scans: 2
      maximum_temporal_context_scans: 3
      temporal_persistence_threshold: 0.66
      # Control plane accepts the closest normalized volume from each of the
      # other three radars only inside this strict same-cycle window.
      cross_radar_max_time_offset_seconds: 300
      cross_radar_echo_threshold_dbzh: 10.0
      minimum_cross_radar_overlap_gates: 80
      cross_radar_promotion_max_consistency: 0.20
      cross_radar_veto_min_consistency: 0.70
    multiscale_promotion:
      enabled: true
      echo_threshold_dbzh: 30.0
      short_window_rays: 4
      long_window_rays: 40
      minimum_score_gate_fraction: 0.02
      minimum_edge_jump_gate_fraction: 0.10
      minimum_diagnostic_gates: 100
      minimum_high_dbzh: 45.0
      minimum_high_gates: 100
      minimum_range_growth_db: 12.0

static_ground_clutter:
  asset_uri: null
  asset_version: null
  flag_probability: 0.70

sea_ap:
  coastline_asset_uri: null
  asset_version: null
  flag_probability: 0.70

quality_index:
  aggregation: product
  components: [QI_METEO, QI_INTERFERENCE, QI_RANGE]
  minimum_range_quality: 0.92
  low_quality_threshold: 0.45
  unavailable_component_policy: skip_and_record
