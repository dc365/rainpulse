  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  in_order: true
  batched_shard_reads: true

checkpoint:
  maximum_interval_steps: 5000
  maximum_interval_seconds: 1800
  graceful_signals: [SIGINT, SIGTERM]
  atomic_write_and_loadback: true

reproducibility:
