temporal_sampling:
  split: training
  random_seed: 2026083101
  years: [2019, 2020, 2021, 2022, 2023]
  windows_per_year: 800
  minimum_separation_minutes: 360

spatial_sampling:
  crop_size: 256
  candidate_stride_cells: 32
  crops_per_window: 25
  importance_crops_per_window: 20
  uniform_crops_per_window: 5
  importance_epsilon: 1.0
  minimum_origin_separation_cells: 128
  rain_rate_cap_mm_h: 128.0
  reject_any_missing: true

native_grid:
  longitude_count: 7000
  latitude_count: 3500
  west_edge_deg: -130.0
  east_edge_deg: -60.0
  south_edge_deg: 20.0
  north_edge_deg: 55.0
  resolution_deg: 0.01
  latitude_order: ascending_after_decode

storage:
  raw_root_env: RAINPULSE_MRMS_RAW_ROOT
  output_root_env: RAINPULSE_MRMS_FULL_ROOT
  output_storage_class: external_network_filesystem
  allowed_filesystem_types: [nfs, nfs4]
  raw_root_immutable: true
  roots_must_not_overlap: true

output:
  sample_count: 100000
  shard_count: 4000
  samples_per_shard: 25
  format: zarr-v2-window-shards
  rain_rate_dtype: float16
  valid_mask_dtype: uint8
  compressor: blosc-zstd-bitshuffle
  compression_level: 3
  minimum_free_bytes: 500000000000
  maximum_logical_output_bytes: 600000000000
  maximum_physical_output_bytes: 400000000000
