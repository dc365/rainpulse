openapi: 3.0.3
info:
  title: RainPulse Control API
  version: 1.1.0
  description: >-
    Public control-plane contract for the RainPulse 0–2 hour precipitation
    nowcasting system. React clients communicate only with this API.
servers:
  - url: /api/v1
tags:
  - name: runs
  - name: radars
  - name: analysis
  - name: products
  - name: verification
  - name: alerts
  - name: system
  - name: admin
paths:
  /runs/latest:
    get:
      operationId: getLatestRun
      tags: [runs]
      summary: Get the latest forecast run
      responses:
        "200":
          description: Latest forecast run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastRun"
        "404":
          $ref: "#/components/responses/NotFound"
  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List forecast runs
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RunStatus"
      responses:
        "200":
          description: Forecast run page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastRunPage"
  /runs/{run_id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Get one forecast run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Forecast run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastRun"
        "404":
          $ref: "#/components/responses/NotFound"
  /runs/{run_id}/jobs:
    get:
      operationId: listRunJobs
      tags: [runs]
      summary: List jobs belonging to a forecast run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Jobs ordered by creation time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForecastJob"
  /radars:
    get:
      operationId: listRadars
      tags: [radars]
      summary: List registered physical radars
      responses:
        "200":
          description: Registered radars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Radar"
  /radars/status:
    get:
      operationId: listRadarStatuses
      tags: [radars]
      summary: List the latest integrity and health status for every radar
      responses:
        "200":
          description: Latest radar health summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RadarStatusSummary"
  /radars/{radar_id}:
    get:
      operationId: getRadar
      tags: [radars]
      summary: Get one radar registration
      parameters:
        - $ref: "#/components/parameters/RadarId"
      responses:
        "200":
          description: Radar registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Radar"
        "404":
          $ref: "#/components/responses/NotFound"
  /radars/{radar_id}/status:
    get:
      operationId: getRadarStatus
      tags: [radars]
      summary: Get the latest operational status for one radar
      parameters:
        - $ref: "#/components/parameters/RadarId"
      responses:
        "200":
          description: Latest radar status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarStatusSummary"
        "404":
          $ref: "#/components/responses/NotFound"
  /radar-scans:
    get:
      operationId: listRadarScans
      tags: [radars]
      summary: List single-radar volume workflows
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: radar_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RadarScanRunStatus"
      responses:
        "200":
          description: Radar scan workflow page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarScanPage"
  /radar-scans/{scan_id}:
    get:
      operationId: getRadarScan
      tags: [radars]
      summary: Get one single-radar volume workflow
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "200":
          description: Radar scan workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarScan"
        "404":
          $ref: "#/components/responses/NotFound"
  /radar-scans/{scan_id}/qc-summary:
    get:
      operationId: getRadarScanQCSummary
      tags: [radars]
      summary: Get the versioned polar QC summary for one radar scan
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "200":
          description: Radar polar QC summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarQCMetrics"
        "404":
          $ref: "#/components/responses/NotFound"
  /radar-scans/{scan_id}/grid-summary:
    get:
      operationId: getRadarScanGridSummary
      tags: [radars]
      summary: Get the versioned hybrid-scan grid summary for one radar scan
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "200":
          description: Radar hybrid-scan grid summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarGridMetrics"
        "404":
          $ref: "#/components/responses/NotFound"
  /analysis-cycles:
    get:
      operationId: listAnalysisCycles
      tags: [analysis]
      summary: List fixed-time multi-radar analysis workflows
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/AnalysisCycleStatus"
      responses:
        "200":
          description: Analysis-cycle page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisCyclePage"
  /analysis-cycles/{analysis_id}:
    get:
      operationId: getAnalysisCycle
      tags: [analysis]
      summary: Get one analysis workflow and its actual radar contributors
      parameters:
        - $ref: "#/components/parameters/AnalysisId"
      responses:
        "200":
          description: Analysis cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisCycle"
        "404":
          $ref: "#/components/responses/NotFound"
  /analysis-cycles/{analysis_id}/mosaic-summary:
    get:
      operationId: getAnalysisMosaicSummary
      tags: [analysis]
      summary: Get the RP-010 time-aligned quality-aware mosaic summary
      parameters:
        - $ref: "#/components/parameters/AnalysisId"
      responses:
        "200":
          description: Radar mosaic summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisMosaicMetrics"
        "404":
          $ref: "#/components/responses/NotFound"
  /analysis-cycles/{analysis_id}/qpe-summary:
    get:
      operationId: getAnalysisQpeSummary
      tags: [analysis]
      summary: Get the RP-011 versioned basic QPE summary
      parameters:
        - $ref: "#/components/parameters/AnalysisId"
      responses:
        "200":
          description: Basic QPE summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisQPEMetrics"
        "404":
          $ref: "#/components/responses/NotFound"
  /analysis-cycles/{analysis_id}/diagnostics:
    get:
      operationId: getAnalysisDiagnostics
      tags: [analysis]
      summary: Get the accepted RP-012 diagnostic manifest for an analysis
      parameters:
        - $ref: "#/components/parameters/AnalysisId"
      responses:
        "200":
          description: Pre-rendered analysis and contributing-radar diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticBundle"
        "404":
          $ref: "#/components/responses/NotFound"
  /diagnostics/{job_id}/layers/{layer_id}:
    get:
      operationId: getDiagnosticLayer
      tags: [analysis]
      summary: Read one immutable PNG layer listed by a diagnostic manifest
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/LayerId"
      responses:
        "200":
          description: Transparent diagnostic PNG
          headers:
            ETag:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List published products
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: run_id
          in: query
          schema:
            type: string
            format: uuid
        - name: model_id
          in: query
          schema:
            type: string
        - name: product_type
          in: query
          schema:
            $ref: "#/components/schemas/ProductType"
      responses:
        "200":
          description: Product page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
  /products/{product_id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product metadata
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
  /products/{product_id}/assets:
    get:
      operationId: listProductAssets
      tags: [products]
      summary: List files and object-store assets for a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductAsset"
  /products/{product_id}/assets/{asset_id}/content:
    get:
      operationId: getProductAssetContent
      tags: [products]
      summary: Read one immutable registered product asset
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Registered product object bytes
          headers:
            ETag:
              schema:
                type: string
          content:
            image/png:
              schema: { type: string, format: binary }
            image/tiff:
              schema: { type: string, format: binary }
            application/x-netcdf:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"
  /point-forecast:
    get:
      operationId: getPointForecast
      tags: [products]
      summary: Query forecast values at a geographic point
      parameters:
        - name: product_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
      responses:
        "200":
          description: Point forecast series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointForecast"
        "404":
          $ref: "#/components/responses/NotFound"
  /area-statistics:
    get:
      operationId: getAreaStatistics
      tags: [products]
      summary: Query statistics inside a WGS84 bounding box
      parameters:
        - name: product_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: bbox
          in: query
          required: true
          description: min longitude, min latitude, max longitude, max latitude
          schema:
            type: array
            minItems: 4
            maxItems: 4
            items:
              type: number
              format: double
          style: form
          explode: false
        - name: lead_time_minutes
          in: query
          required: true
          schema:
            type: integer
            minimum: 5
            maximum: 120
            multipleOf: 5
      responses:
        "200":
          description: Area statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaStatistics"
        "404":
          $ref: "#/components/responses/NotFound"
  /verification/summary:
    get:
      operationId: getVerificationSummary
      tags: [verification]
      summary: Get verification summary for one run
      parameters:
        - name: run_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Verification summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSummary"
        "404":
          $ref: "#/components/responses/NotFound"
  /algorithm-verification/runs:
    get:
      operationId: listAlgorithmVerificationRuns
      tags: [verification]
      summary: List available offline algorithm-verification runs
      responses:
        "200":
          description: Offline algorithm-verification runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlgorithmVerificationRunList"
  /algorithm-verification/runs/{profile_version}/{run_id}:
    get:
      operationId: getAlgorithmVerificationRun
      tags: [verification]
      summary: Get one offline algorithm-verification run and its filter dimensions
      parameters:
        - $ref: "#/components/parameters/VerificationProfileVersion"
        - $ref: "#/components/parameters/VerificationRunId"
      responses:
        "200":
          description: Offline algorithm-verification run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlgorithmVerificationRunDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /algorithm-verification/runs/{profile_version}/{run_id}/metrics:
    get:
      operationId: listAlgorithmVerificationMetrics
      tags: [verification]
      summary: List one issue's model metrics for a threshold and FSS window
      parameters:
        - $ref: "#/components/parameters/VerificationProfileVersion"
        - $ref: "#/components/parameters/VerificationRunId"
        - name: case_id
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
        - name: issue_time
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: threshold_mm_h
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: 0
        - name: window_pixels
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Filtered offline verification metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlgorithmVerificationMetricList"
        "404":
          $ref: "#/components/responses/NotFound"
  /algorithm-verification/runs/{profile_version}/{run_id}/map-frame:
    get:
      operationId: getAlgorithmVerificationMapFrame
      tags: [verification]
      summary: Get georeferenced truth and deterministic-forecast map evidence for one lead
      parameters:
        - $ref: "#/components/parameters/VerificationProfileVersion"
        - $ref: "#/components/parameters/VerificationRunId"
        - name: case_id
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
        - name: issue_time
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: lead_minutes
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 1440
      responses:
        "200":
          description: One synchronized algorithm-verification map frame
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlgorithmVerificationMapFrame"
        "404":
          $ref: "#/components/responses/NotFound"
  /algorithm-verification/runs/{profile_version}/{run_id}/map-assets/{case_id}/{issue_key}/{asset_id}:
    get:
      operationId: getAlgorithmVerificationMapAsset
      tags: [verification]
      summary: Read one immutable PNG explicitly listed by a verification map manifest
      parameters:
        - $ref: "#/components/parameters/VerificationProfileVersion"
        - $ref: "#/components/parameters/VerificationRunId"
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
        - name: issue_key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{8}T[0-9]{6}Z$'
        - name: asset_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]{0,127}$'
      responses:
        "200":
          description: Immutable algorithm-verification PNG
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /ensemble-products/latest:
    get:
      operationId: getLatestEnsembleProductBundle
      tags: [products]
      summary: Get the newest offline ensemble application-product bundle
      responses:
        "200":
          description: Offline probability and quantile GIS product bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnsembleProductBundle"
        "404":
          $ref: "#/components/responses/NotFound"
  /ensemble-products/{bundle_id}/assets/{asset_id}:
    get:
      operationId: getEnsembleProductAsset
      tags: [products]
      summary: Read one immutable offline ensemble PNG or NetCDF asset
      parameters:
        - name: bundle_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: asset_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]{0,126}$'
      responses:
        "200":
          description: Immutable offline ensemble product asset
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /system/status:
    get:
      operationId: getSystemStatus
      tags: [system]
      summary: Get control-plane readiness and version
      responses:
        "200":
          description: Control-plane status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
  /alerts:
    get:
      operationId: getAlertSnapshot
      tags: [alerts]
      summary: Get the current Prometheus rule and Alertmanager delivery state
      responses:
        "200":
          description: Current read-only alert snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSnapshot"
  /operations/issues:
    get:
      operationId: getOperationalIssueSnapshot
      tags: [operations]
      summary: Get current failed jobs, stuck jobs, and unpublished outbox evidence
      responses:
        "200":
          description: Current read-only operational issue snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalIssueSnapshot"
        "503":
          description: Operational evidence store is unavailable
  /events/stream:
    get:
      operationId: streamEvents
      tags: [system]
      summary: Stream forecast, radar-scan, or analysis-cycle updates using SSE
      parameters:
        - name: run_id
          in: query
          schema:
            type: string
            format: uuid
        - name: scan_id
          in: query
          description: Stream one radar scan; mutually exclusive with run_id and analysis_id.
          schema:
            type: string
            format: uuid
        - name: analysis_id
          in: query
          description: Stream one analysis cycle; mutually exclusive with run_id and scan_id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Server-Sent Event stream
          content:
            text/event-stream:
              schema:
                type: string
  /admin/runs/{run_id}/rerun:
    post:
      operationId: rerunForecastRun
      tags: [admin]
      security:
        - adminBearer: []
      summary: Create a new run using the selected run inputs and configuration
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: Rerun accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastRun"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/models/{model_id}/enable:
    post:
      operationId: enableModel
      tags: [admin]
      security:
        - adminBearer: []
      summary: Enable a configured model
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "200":
          description: Updated model state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelState"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/models/{model_id}/disable:
    post:
      operationId: disableModel
      tags: [admin]
      security:
        - adminBearer: []
      summary: Disable a configured model
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "200":
          description: Updated model state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelState"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-admin-token
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: product_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelId:
      name: model_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RadarId:
      name: radar_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ScanId:
      name: scan_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AnalysisId:
      name: analysis_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LayerId:
      name: layer_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{2,127}$"
    VerificationProfileVersion:
      name: profile_version
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
    VerificationRunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    RunStatus:
      type: string
      enum:
        - WAITING
        - RECEIVED
        - VALIDATING
        - PREPROCESSING
        - INPUT_READY
        - BASELINE_RUNNING
        - BASELINE_READY
        - ENHANCED_RUNNING
        - PRODUCT_BUILDING
        - PUBLISHED
        - VERIFYING
        - VERIFIED
        - DEGRADED
        - FAILED
        - SKIPPED
    JobStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED, SKIPPED]
    ProductType:
      type: string
      enum:
        - rain_rate
        - accumulation_60
        - accumulation_120
        - probability_exceedance
