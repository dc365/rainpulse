    image: rainpulse-cpu-worker:performance-cd-qc-20260927
  ops-qc-worker:
    image: rainpulse-cpu-worker:performance-cd-full-20260927-r1
    mem_limit: 40g
    memswap_limit: 40g
  ops-multiband-worker:
    image: rainpulse-cpu-worker:performance-cd-full-20260927-r1
