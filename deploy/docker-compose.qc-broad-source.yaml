# Opt-in candidate. Drain old QC requests before switching the frozen profile.
# Apply after existing geometry/six-minute/P0P2 overlays.
services:
  radar-qc-worker:
    image: rainpulse-cpu-worker:qc-opensource-7.3.0-broad-source
    environment:
      RAINPULSE_RADAR_QC_CONFIG: /opt/rainpulse/configs/qc/fujian-qc-broad-source-v1.yaml
  radar-grid-worker:
    image: rainpulse-cpu-worker:qc-opensource-7.3.0-broad-source
  radar-mosaic-worker:
    image: rainpulse-cpu-worker:qc-opensource-7.3.0-broad-source
  analysis-qpe-worker:
    image: rainpulse-cpu-worker:qc-opensource-7.3.0-broad-source
  analysis-diagnostics-worker:
    image: rainpulse-cpu-worker:qc-opensource-7.3.0-broad-source
