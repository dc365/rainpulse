    image: rainpulse-cpu-worker:qc-opensource-7.2.0-p0p2
    environment:
      RAINPULSE_RADAR_QC_CONFIG: /opt/rainpulse/configs/qc/fujian-qc-generalization-p0p2.yaml
  radar-grid-worker:
    image: rainpulse-cpu-worker:qc-opensource-7.2.0-p0p2
  radar-mosaic-worker:
    image: rainpulse-cpu-worker:qc-opensource-7.2.0-p0p2
  analysis-qpe-worker:
    image: rainpulse-cpu-worker:qc-opensource-7.2.0-p0p2
  analysis-diagnostics-worker:
    image: rainpulse-cpu-worker:qc-opensource-7.2.0-p0p2
