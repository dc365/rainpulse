  api:
    build:
      context: ..
      dockerfile: services/control/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      orchestrator:
        condition: service_healthy
      simulation-worker:
        condition: service_healthy
      analysis-diagnostics-worker:
        condition: service_healthy
      nowcast-input-worker:
        condition: service_healthy
      pysteps-lk-worker:
        condition: service_healthy
      product-builder-worker:
        condition: service_healthy
      forecast-verification-worker:
        condition: service_healthy
    environment:
      RAINPULSE_HTTP_ADDR: ":8080"
      RAINPULSE_VERSION: "${RAINPULSE_VERSION:-}"
      RAINPULSE_PROMETHEUS_URL: http://prometheus:9090
      RAINPULSE_ALERTMANAGER_URL: http://alertmanager:9093
      RAINPULSE_DATABASE_HOST: postgres
      RAINPULSE_DATABASE_NAME: rainpulse
      RAINPULSE_DATABASE_USER: rainpulse
      RAINPULSE_DATABASE_PASSWORD: "${RAINPULSE_POSTGRES_PASSWORD:?set RAINPULSE_POSTGRES_PASSWORD in deploy/.env}"
      RAINPULSE_NATS_URL: "nats://${RAINPULSE_NATS_USER:?set RAINPULSE_NATS_USER in deploy/.env}:${RAINPULSE_NATS_PASSWORD:?set RAINPULSE_NATS_PASSWORD in deploy/.env}@nats:4222"
      RAINPULSE_OBJECT_STORE_ENDPOINT: http://minio:9000
      RAINPULSE_OBJECT_STORE_BUCKET: rainpulse
      RAINPULSE_OBJECT_STORE_ACCESS_KEY: "${RAINPULSE_MINIO_WORKER_ACCESS_KEY:?set RAINPULSE_MINIO_WORKER_ACCESS_KEY in deploy/.env}"
      RAINPULSE_OBJECT_STORE_SECRET_KEY: "${RAINPULSE_MINIO_WORKER_SECRET_KEY:?set RAINPULSE_MINIO_WORKER_SECRET_KEY in deploy/.env}"
      RAINPULSE_MAX_INPUT_ARTIFACT_BYTES: "${RAINPULSE_MAX_INPUT_ARTIFACT_BYTES:-2147483648}"
      RAINPULSE_ALGORITHM_VERIFICATION_ROOT: /var/lib/rainpulse/algorithm-verification
      RAINPULSE_ENSEMBLE_PRODUCT_ROOT: /var/lib/rainpulse/ensemble-products
      RAINPULSE_ADMIN_TOKEN: "${RAINPULSE_ADMIN_TOKEN:-}"
      TZ: UTC
    volumes:
      - "${RAINPULSE_ALGORITHM_VERIFICATION_HOST_ROOT:-../runtime/reports/mrms}:/var/lib/rainpulse/algorithm-verification:ro"
      - "${RAINPULSE_ENSEMBLE_PRODUCT_HOST_ROOT:-../runtime/products/ensemble}:/var/lib/rainpulse/ensemble-products:ro"
    ports:
      - "${RAINPULSE_API_BIND_ADDRESS:-127.0.0.1}:${RAINPULSE_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/rainpulse-api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      RAINPULSE_API_BASE_URL: "http://api:8080"
      RAINPULSE_WEB_ADDR: ":8080"
      RAINPULSE_WEB_ROOT: "/srv/rainpulse-web"
    ports:
      - "${RAINPULSE_BIND_ADDRESS:-0.0.0.0}:${RAINPULSE_WEB_PORT:-4173}:8080"
    healthcheck:
      test: ["CMD", "/rainpulse-web", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.1
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
      minio:
        condition: service_healthy
      node-exporter:
        condition: service_started
      orchestrator:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/rainpulse-alerts.yaml:/etc/prometheus/rainpulse-alerts.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "${RAINPULSE_INFRA_BIND_ADDRESS:-127.0.0.1}:${RAINPULSE_PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  alertmanager:
    image: rainpulse/alertmanager:v0.34.0
    build:
      context: ..
      dockerfile: deploy/alertmanager/Dockerfile
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
      - --storage.path=/alertmanager
      - --data.retention=120h
    volumes:
      - ./observability/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${RAINPULSE_INFRA_BIND_ADDRESS:-127.0.0.1}:${RAINPULSE_ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "/rainpulse-healthcheck", "http://127.0.0.1:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  nats-data:
  minio-data:
  prometheus-data:
  alertmanager-data:
