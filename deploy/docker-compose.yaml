name: rainpulse

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: rainpulse
      POSTGRES_USER: rainpulse
      POSTGRES_PASSWORD: "${RAINPULSE_POSTGRES_PASSWORD:?set RAINPULSE_POSTGRES_PASSWORD in deploy/.env}"
      TZ: UTC
    ports:
      - "${RAINPULSE_INFRA_BIND_ADDRESS:-127.0.0.1}:${RAINPULSE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rainpulse -d rainpulse"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: postgres:17.11-alpine3.24
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: rainpulse
      PGUSER: rainpulse
      PGPASSWORD: "${RAINPULSE_POSTGRES_PASSWORD:?set RAINPULSE_POSTGRES_PASSWORD in deploy/.env}"
      PGCONNECT_TIMEOUT: "5"
      TZ: UTC
    volumes:
      - ./postgres/migrate.sh:/migrations/migrate.sh:ro
      - ./postgres/migrations:/migrations/sql:ro
    command: ["/bin/sh", "/migrations/migrate.sh"]
    restart: "no"

  nats:
    image: rainpulse/nats-server:2.14.5
    build:
      context: ..
      dockerfile: deploy/nats/Dockerfile
    ports:
      - "${RAINPULSE_INFRA_BIND_ADDRESS:-127.0.0.1}:${RAINPULSE_NATS_PORT:-4222}:4222"
      - "${RAINPULSE_INFRA_BIND_ADDRESS:-127.0.0.1}:${RAINPULSE_NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data/jetstream
    healthcheck:
      test: ["CMD", "/rainpulse-healthcheck", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio:
    image: rainpulse/minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ..
      dockerfile: deploy/minio/Dockerfile
    environment:
      MINIO_ROOT_USER: "${RAINPULSE_MINIO_ROOT_USER:?set RAINPULSE_MINIO_ROOT_USER in deploy/.env}"
      MINIO_ROOT_PASSWORD: "${RAINPULSE_MINIO_ROOT_PASSWORD:?set RAINPULSE_MINIO_ROOT_PASSWORD in deploy/.env}"
      MINIO_BROWSER_REDIRECT_URL: "${RAINPULSE_MINIO_BROWSER_REDIRECT_URL:-http://127.0.0.1:9001}"
      TZ: UTC
    ports:
      - "${RAINPULSE_INFRA_BIND_ADDRESS:-127.0.0.1}:${RAINPULSE_MINIO_PORT:-9000}:9000"
      - "${RAINPULSE_INFRA_BIND_ADDRESS:-127.0.0.1}:${RAINPULSE_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "/rainpulse-healthcheck", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: rainpulse/minio-client:RELEASE.2025-08-13T08-35-41Z
    build:
      context: ..
      dockerfile: deploy/minio/mc.Dockerfile
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_rainpulse: "http://${RAINPULSE_MINIO_ROOT_USER:?set RAINPULSE_MINIO_ROOT_USER in deploy/.env}:${RAINPULSE_MINIO_ROOT_PASSWORD:?set RAINPULSE_MINIO_ROOT_PASSWORD in deploy/.env}@minio:9000"
    command: ["mb", "--ignore-existing", "rainpulse/${RAINPULSE_MINIO_BUCKET:-rainpulse}"]
    restart: "no"

  minio-worker-user:
    image: rainpulse/minio-client:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MC_HOST_rainpulse: "http://${RAINPULSE_MINIO_ROOT_USER:?set RAINPULSE_MINIO_ROOT_USER in deploy/.env}:${RAINPULSE_MINIO_ROOT_PASSWORD:?set RAINPULSE_MINIO_ROOT_PASSWORD in deploy/.env}@minio:9000"
    command:
      - admin
      - user
      - add
      - rainpulse
      - "${RAINPULSE_MINIO_WORKER_ACCESS_KEY:?set RAINPULSE_MINIO_WORKER_ACCESS_KEY in deploy/.env}"
      - "${RAINPULSE_MINIO_WORKER_SECRET_KEY:?set RAINPULSE_MINIO_WORKER_SECRET_KEY in deploy/.env}"
    restart: "no"

  minio-worker-policy:
    image: rainpulse/minio-client:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio-worker-user:
        condition: service_completed_successfully
    environment:
      MC_HOST_rainpulse: "http://${RAINPULSE_MINIO_ROOT_USER:?set RAINPULSE_MINIO_ROOT_USER in deploy/.env}:${RAINPULSE_MINIO_ROOT_PASSWORD:?set RAINPULSE_MINIO_ROOT_PASSWORD in deploy/.env}@minio:9000"
    command:
      - admin
      - policy
      - attach
      - rainpulse
      - readwrite
      - --user
      - "${RAINPULSE_MINIO_WORKER_ACCESS_KEY:?set RAINPULSE_MINIO_WORKER_ACCESS_KEY in deploy/.env}"
    restart: "no"

  orchestrator:
    image: rainpulse-orchestrator
    build:
      context: ..
      dockerfile: services/control/orchestrator.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      RAINPULSE_DATABASE_HOST: postgres
      RAINPULSE_DATABASE_NAME: rainpulse
      RAINPULSE_DATABASE_USER: rainpulse
      RAINPULSE_DATABASE_PASSWORD: "${RAINPULSE_POSTGRES_PASSWORD:?set RAINPULSE_POSTGRES_PASSWORD in deploy/.env}"
      RAINPULSE_NATS_URL: nats://nats:4222
      RAINPULSE_ORCHESTRATOR_HEALTH_ADDR: ":8090"
      TZ: UTC
    volumes:
      - ../configs:/opt/rainpulse/configs:ro
      - /data/Weather/RADA/FMT_L2_Z959X_SBD:/data/Weather/RADA/FMT_L2_Z959X_SBD:ro
    healthcheck:
      test: ["CMD", "/rainpulse-healthcheck", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  simulation-worker:
    image: rainpulse-simulation-worker
    build:
      context: ..
      dockerfile: algorithms/worker.Dockerfile
    depends_on:
      nats:
        condition: service_healthy
      minio-worker-policy:
        condition: service_completed_successfully
      orchestrator:
        condition: service_healthy
    environment:
      RAINPULSE_NATS_URL: nats://nats:4222
      RAINPULSE_OBJECT_STORE_ENDPOINT: http://minio:9000
      RAINPULSE_OBJECT_STORE_ACCESS_KEY: "${RAINPULSE_MINIO_WORKER_ACCESS_KEY:?set RAINPULSE_MINIO_WORKER_ACCESS_KEY in deploy/.env}"
      RAINPULSE_OBJECT_STORE_SECRET_KEY: "${RAINPULSE_MINIO_WORKER_SECRET_KEY:?set RAINPULSE_MINIO_WORKER_SECRET_KEY in deploy/.env}"
      RAINPULSE_WORKER_HEALTH_ADDR: "0.0.0.0:8091"
      RAINPULSE_WORKER_ID: pysteps-lk-sim
      RAINPULSE_WORKER_PROFILE: simulation
      TZ: UTC
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=2))['status'] == 'ready'"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  radar-decode-worker:
    image: rainpulse-radar-decode-worker
    build:
      context: ..
      dockerfile: algorithms/worker.Dockerfile
    depends_on:
      nats:
        condition: service_healthy
      minio-worker-policy:
        condition: service_completed_successfully
      orchestrator:
        condition: service_healthy
    environment:
      RAINPULSE_NATS_URL: nats://nats:4222
      RAINPULSE_OBJECT_STORE_ENDPOINT: http://minio:9000
      RAINPULSE_OBJECT_STORE_ACCESS_KEY: "${RAINPULSE_MINIO_WORKER_ACCESS_KEY:?set RAINPULSE_MINIO_WORKER_ACCESS_KEY in deploy/.env}"
      RAINPULSE_OBJECT_STORE_SECRET_KEY: "${RAINPULSE_MINIO_WORKER_SECRET_KEY:?set RAINPULSE_MINIO_WORKER_SECRET_KEY in deploy/.env}"
      RAINPULSE_WORKER_HEALTH_ADDR: "0.0.0.0:8091"
      RAINPULSE_WORKER_ID: cma-rstm-z9598
      RAINPULSE_WORKER_PROFILE: radar-decode-fmt
      RAINPULSE_RADAR_CONFIG_DIR: /opt/rainpulse/configs/radars
      RAINPULSE_RADAR_HEALTH_CONFIG: /opt/rainpulse/configs/health/rp007-integrity-v1.yaml
      RAINPULSE_RADAR_INPUT_ROOTS: /data/Weather/RADA/FMT_L2_Z959X_SBD
      TZ: UTC
    volumes:
      - ../configs:/opt/rainpulse/configs:ro
      - /data/Weather/RADA/FMT_L2_Z959X_SBD:/data/Weather/RADA/FMT_L2_Z959X_SBD:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=2))['profile'] == 'radar-decode-fmt'"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: services/control/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      orchestrator:
        condition: service_healthy
      simulation-worker:
        condition: service_healthy
    environment:
      RAINPULSE_HTTP_ADDR: ":8080"
      RAINPULSE_VERSION: "${RAINPULSE_VERSION:-dev}"
      RAINPULSE_DATABASE_HOST: postgres
      RAINPULSE_DATABASE_NAME: rainpulse
      RAINPULSE_DATABASE_USER: rainpulse
      RAINPULSE_DATABASE_PASSWORD: "${RAINPULSE_POSTGRES_PASSWORD:?set RAINPULSE_POSTGRES_PASSWORD in deploy/.env}"
      RAINPULSE_NATS_URL: nats://nats:4222
      RAINPULSE_OBJECT_STORE_ENDPOINT: http://minio:9000
      RAINPULSE_OBJECT_STORE_BUCKET: "${RAINPULSE_MINIO_BUCKET:-rainpulse}"
      TZ: UTC
    ports:
      - "${RAINPULSE_BIND_ADDRESS:-0.0.0.0}:${RAINPULSE_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/rainpulse-api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      RAINPULSE_API_BASE_URL: "http://api:8080"
      RAINPULSE_WEB_ADDR: ":8080"
      RAINPULSE_WEB_ROOT: "/srv/rainpulse-web"
    ports:
      - "${RAINPULSE_BIND_ADDRESS:-0.0.0.0}:${RAINPULSE_WEB_PORT:-4173}:8080"
    healthcheck:
      test: ["CMD", "/rainpulse-web", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  nats-data:
  minio-data:
