name: rainpulse

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: rainpulse
      POSTGRES_USER: rainpulse
      POSTGRES_PASSWORD: "${RAINPULSE_POSTGRES_PASSWORD:?set RAINPULSE_POSTGRES_PASSWORD in deploy/.env}"
      TZ: UTC
    ports:
      - "${RAINPULSE_INFRA_BIND_ADDRESS:-127.0.0.1}:${RAINPULSE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rainpulse -d rainpulse"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: postgres:17.11-alpine3.24
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: rainpulse
      PGUSER: rainpulse
      PGPASSWORD: "${RAINPULSE_POSTGRES_PASSWORD:?set RAINPULSE_POSTGRES_PASSWORD in deploy/.env}"
      PGCONNECT_TIMEOUT: "5"
      TZ: UTC
    volumes:
      - ./postgres/migrate.sh:/migrations/migrate.sh:ro
      - ./postgres/migrations:/migrations/sql:ro
    command: ["/bin/sh", "/migrations/migrate.sh"]
    restart: "no"

  nats:
    image: rainpulse/nats-server:2.14.5
    build:
      context: ..
      dockerfile: deploy/nats/Dockerfile
    ports:
      - "${RAINPULSE_INFRA_BIND_ADDRESS:-127.0.0.1}:${RAINPULSE_NATS_PORT:-4222}:4222"
      - "${RAINPULSE_INFRA_BIND_ADDRESS:-127.0.0.1}:${RAINPULSE_NATS_MONITOR_PORT:-8222}:8222"
    environment:
      RAINPULSE_NATS_USER: "${RAINPULSE_NATS_USER:?set RAINPULSE_NATS_USER in deploy/.env}"
      RAINPULSE_NATS_PASSWORD: "${RAINPULSE_NATS_PASSWORD:?set RAINPULSE_NATS_PASSWORD in deploy/.env}"
    volumes:
      - nats-data:/data/jetstream
    healthcheck:
      test: ["CMD", "/rainpulse-healthcheck", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio:
    image: rainpulse/minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ..
      dockerfile: deploy/minio/Dockerfile
    environment:
      MINIO_ROOT_USER: "${RAINPULSE_MINIO_ROOT_USER:?set RAINPULSE_MINIO_ROOT_USER in deploy/.env}"
      MINIO_ROOT_PASSWORD: "${RAINPULSE_MINIO_ROOT_PASSWORD:?set RAINPULSE_MINIO_ROOT_PASSWORD in deploy/.env}"
      MINIO_BROWSER_REDIRECT_URL: "${RAINPULSE_MINIO_BROWSER_REDIRECT_URL:-http://127.0.0.1:9001}"
      MINIO_PROMETHEUS_AUTH_TYPE: public
      TZ: UTC
    ports:
      - "${RAINPULSE_INFRA_BIND_ADDRESS:-127.0.0.1}:${RAINPULSE_MINIO_PORT:-9000}:9000"
      - "${RAINPULSE_INFRA_BIND_ADDRESS:-127.0.0.1}:${RAINPULSE_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "/rainpulse-healthcheck", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: rainpulse/minio-client:RELEASE.2025-08-13T08-35-41Z
    build:
      context: ..
      dockerfile: deploy/minio/mc.Dockerfile
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_rainpulse: "http://${RAINPULSE_MINIO_ROOT_USER:?set RAINPULSE_MINIO_ROOT_USER in deploy/.env}:${RAINPULSE_MINIO_ROOT_PASSWORD:?set RAINPULSE_MINIO_ROOT_PASSWORD in deploy/.env}@minio:9000"
    command: ["mb", "--ignore-existing", "rainpulse/rainpulse"]
    restart: "no"

  minio-versioning:
    image: rainpulse/minio-client:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MC_HOST_rainpulse: "http://${RAINPULSE_MINIO_ROOT_USER:?set RAINPULSE_MINIO_ROOT_USER in deploy/.env}:${RAINPULSE_MINIO_ROOT_PASSWORD:?set RAINPULSE_MINIO_ROOT_PASSWORD in deploy/.env}@minio:9000"
    command: ["version", "enable", "rainpulse/rainpulse"]
    restart: "no"

  minio-worker-user:
    image: rainpulse/minio-client:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio-versioning:
        condition: service_completed_successfully
    environment:
      MC_HOST_rainpulse: "http://${RAINPULSE_MINIO_ROOT_USER:?set RAINPULSE_MINIO_ROOT_USER in deploy/.env}:${RAINPULSE_MINIO_ROOT_PASSWORD:?set RAINPULSE_MINIO_ROOT_PASSWORD in deploy/.env}@minio:9000"
    command:
      - admin
      - user
      - add
      - rainpulse
      - "${RAINPULSE_MINIO_WORKER_ACCESS_KEY:?set RAINPULSE_MINIO_WORKER_ACCESS_KEY in deploy/.env}"
      - "${RAINPULSE_MINIO_WORKER_SECRET_KEY:?set RAINPULSE_MINIO_WORKER_SECRET_KEY in deploy/.env}"
    restart: "no"

  minio-worker-policy-create:
    image: rainpulse/minio-client:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio-worker-user:
        condition: service_completed_successfully
    environment:
      MC_HOST_rainpulse: "http://${RAINPULSE_MINIO_ROOT_USER:?set RAINPULSE_MINIO_ROOT_USER in deploy/.env}:${RAINPULSE_MINIO_ROOT_PASSWORD:?set RAINPULSE_MINIO_ROOT_PASSWORD in deploy/.env}@minio:9000"
    volumes:
      - ./minio/worker-policy.json:/policies/worker-policy.json:ro
    command:
      - admin
      - policy
      - create
      - rainpulse
      - rainpulse-worker
      - /policies/worker-policy.json
    restart: "no"

  minio-worker-policy:
    image: rainpulse/minio-client:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio-worker-policy-create:
        condition: service_completed_successfully
    environment:
      MC_HOST_rainpulse: "http://${RAINPULSE_MINIO_ROOT_USER:?set RAINPULSE_MINIO_ROOT_USER in deploy/.env}:${RAINPULSE_MINIO_ROOT_PASSWORD:?set RAINPULSE_MINIO_ROOT_PASSWORD in deploy/.env}@minio:9000"
    command:
      - admin
      - policy
      - attach
      - rainpulse
      - rainpulse-worker
      - --user
      - "${RAINPULSE_MINIO_WORKER_ACCESS_KEY:?set RAINPULSE_MINIO_WORKER_ACCESS_KEY in deploy/.env}"
    restart: "no"

  orchestrator:
    image: rainpulse-orchestrator
    build:
      context: ..
      dockerfile: services/control/orchestrator.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio-worker-policy:
        condition: service_completed_successfully
    environment:
      RAINPULSE_DATABASE_HOST: postgres
      RAINPULSE_DATABASE_NAME: rainpulse
      RAINPULSE_DATABASE_USER: rainpulse
      RAINPULSE_DATABASE_PASSWORD: "${RAINPULSE_POSTGRES_PASSWORD:?set RAINPULSE_POSTGRES_PASSWORD in deploy/.env}"
      RAINPULSE_NATS_URL: "nats://${RAINPULSE_NATS_USER:?set RAINPULSE_NATS_USER in deploy/.env}:${RAINPULSE_NATS_PASSWORD:?set RAINPULSE_NATS_PASSWORD in deploy/.env}@nats:4222"
      RAINPULSE_OBJECT_STORE_ENDPOINT: http://minio:9000
      RAINPULSE_OBJECT_STORE_BUCKET: rainpulse
      RAINPULSE_MINIO_WORKER_ACCESS_KEY: "${RAINPULSE_MINIO_WORKER_ACCESS_KEY:?set RAINPULSE_MINIO_WORKER_ACCESS_KEY in deploy/.env}"
      RAINPULSE_MINIO_WORKER_SECRET_KEY: "${RAINPULSE_MINIO_WORKER_SECRET_KEY:?set RAINPULSE_MINIO_WORKER_SECRET_KEY in deploy/.env}"
      RAINPULSE_ORCHESTRATOR_HEALTH_ADDR: ":8090"
      RAINPULSE_RADAR_INGEST_ENABLED: "${RAINPULSE_RADAR_INGEST_ENABLED:-false}"
      RAINPULSE_RADAR_INGEST_CONFIG: "${RAINPULSE_RADAR_INGEST_CONFIG:-/opt/rainpulse/configs/radars/z9598.yaml}"
      RAINPULSE_RADAR_INGEST_ROOT: "${RAINPULSE_RADAR_INGEST_ROOT:-/data/Weather/RADA/FMT_L2_Z959X_SBD}"
      RAINPULSE_RADAR_INGEST_INTERVAL: "${RAINPULSE_RADAR_INGEST_INTERVAL:-15s}"
      RAINPULSE_RADAR_INGEST_MIN_AGE: "${RAINPULSE_RADAR_INGEST_MIN_AGE:-30s}"
      RAINPULSE_RADAR_INGEST_LOOKBACK: "${RAINPULSE_RADAR_INGEST_LOOKBACK:-24h}"
      RAINPULSE_PIPELINE_ENABLED: "${RAINPULSE_PIPELINE_ENABLED:-false}"
      RAINPULSE_PIPELINE_RADAR_IDS: "${RAINPULSE_PIPELINE_RADAR_IDS:-z9598}"
      RAINPULSE_PIPELINE_INTERVAL: "${RAINPULSE_PIPELINE_INTERVAL:-2s}"
      RAINPULSE_PIPELINE_LOOKBACK: "${RAINPULSE_PIPELINE_LOOKBACK:-1h}"
      RAINPULSE_PIPELINE_MOSAIC_DELAY: "${RAINPULSE_PIPELINE_MOSAIC_DELAY:-2m}"
      RAINPULSE_PIPELINE_FORECAST_ENABLED: "${RAINPULSE_PIPELINE_FORECAST_ENABLED:-true}"
      RAINPULSE_PIPELINE_REQUIRE_ALL_RADARS: "${RAINPULSE_PIPELINE_REQUIRE_ALL_RADARS:-false}"
      RAINPULSE_PIPELINE_QC_CONFIG: /opt/rainpulse/configs/qc/rp040-fujian-radial-v3.yaml
      RAINPULSE_PIPELINE_GRID_CONFIG: /opt/rainpulse/configs/gridding/rp040-hybrid-qc-v3.yaml
      RAINPULSE_PIPELINE_MOSAIC_CONFIG: /opt/rainpulse/configs/mosaic/rp040-fujian-four-radar-qc-v2.yaml
      RAINPULSE_PIPELINE_NOWCAST_INPUT_CONFIG: /opt/rainpulse/configs/nowcast/rp040-historical-replay-v3.yaml
      TZ: UTC
    volumes:
      - ../configs:/opt/rainpulse/configs:ro
      - /data/Weather/RADA/FMT_L2_Z959X_SBD:/data/Weather/RADA/FMT_L2_Z959X_SBD:ro
      - /data/Weather/RADA/RADA_L2_FMT/OBS_TEMP:/data/Weather/RADA/RADA_L2_FMT/OBS_TEMP:ro
    healthcheck:
      test: ["CMD", "/rainpulse-healthcheck", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  simulation-worker:
    image: rainpulse-simulation-worker
    build:
      context: ..
      dockerfile: algorithms/worker.Dockerfile
    depends_on:
      nats:
        condition: service_healthy
      minio-worker-policy:
        condition: service_completed_successfully
      orchestrator:
        condition: service_healthy
    environment:
      RAINPULSE_NATS_URL: "nats://${RAINPULSE_NATS_USER:?set RAINPULSE_NATS_USER in deploy/.env}:${RAINPULSE_NATS_PASSWORD:?set RAINPULSE_NATS_PASSWORD in deploy/.env}@nats:4222"
      RAINPULSE_OBJECT_STORE_ENDPOINT: http://minio:9000
      RAINPULSE_OBJECT_STORE_BUCKET: rainpulse
      RAINPULSE_OBJECT_STORE_ACCESS_KEY: "${RAINPULSE_MINIO_WORKER_ACCESS_KEY:?set RAINPULSE_MINIO_WORKER_ACCESS_KEY in deploy/.env}"
      RAINPULSE_OBJECT_STORE_SECRET_KEY: "${RAINPULSE_MINIO_WORKER_SECRET_KEY:?set RAINPULSE_MINIO_WORKER_SECRET_KEY in deploy/.env}"
      RAINPULSE_MAX_INPUT_ARTIFACT_BYTES: "${RAINPULSE_MAX_INPUT_ARTIFACT_BYTES:-2147483648}"
      RAINPULSE_WORKER_HEALTH_ADDR: "0.0.0.0:8091"
      RAINPULSE_WORKER_ID: pysteps-lk-sim
      RAINPULSE_WORKER_PROFILE: simulation
      TZ: UTC
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=2))['status'] == 'ready'"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  radar-decode-worker:
    image: rainpulse-radar-decode-worker
    build:
      context: ..
      dockerfile: algorithms/worker.Dockerfile
    depends_on:
      nats:
        condition: service_healthy
      minio-worker-policy:
        condition: service_completed_successfully
      orchestrator:
        condition: service_healthy
    environment:
      RAINPULSE_NATS_URL: "nats://${RAINPULSE_NATS_USER:?set RAINPULSE_NATS_USER in deploy/.env}:${RAINPULSE_NATS_PASSWORD:?set RAINPULSE_NATS_PASSWORD in deploy/.env}@nats:4222"
      RAINPULSE_OBJECT_STORE_ENDPOINT: http://minio:9000
      RAINPULSE_OBJECT_STORE_BUCKET: rainpulse
      RAINPULSE_OBJECT_STORE_ACCESS_KEY: "${RAINPULSE_MINIO_WORKER_ACCESS_KEY:?set RAINPULSE_MINIO_WORKER_ACCESS_KEY in deploy/.env}"
      RAINPULSE_OBJECT_STORE_SECRET_KEY: "${RAINPULSE_MINIO_WORKER_SECRET_KEY:?set RAINPULSE_MINIO_WORKER_SECRET_KEY in deploy/.env}"
      RAINPULSE_MAX_INPUT_ARTIFACT_BYTES: "${RAINPULSE_MAX_INPUT_ARTIFACT_BYTES:-2147483648}"
      RAINPULSE_WORKER_HEALTH_ADDR: "0.0.0.0:8091"
      RAINPULSE_WORKER_ID: cma-rstm-z9598
      RAINPULSE_WORKER_PROFILE: radar-decode-fmt
      RAINPULSE_RADAR_CONFIG_DIR: "${RAINPULSE_RADAR_CONFIG_DIR:-/opt/rainpulse/configs/radars}"
      RAINPULSE_RADAR_HEALTH_CONFIG: /opt/rainpulse/configs/health/rp007-integrity-v1.yaml
      TZ: UTC
    volumes:
      - ../configs:/opt/rainpulse/configs:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=2))['profile'] == 'radar-decode-fmt'"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  radar-qc-worker:
    image: rainpulse-radar-qc-worker
    build:
      context: ..
      dockerfile: algorithms/worker.Dockerfile
    depends_on:
      nats:
        condition: service_healthy
