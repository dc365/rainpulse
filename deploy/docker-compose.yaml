        condition: service_completed_successfully
      orchestrator:
        condition: service_healthy
    environment:
      RAINPULSE_NATS_URL: "nats://${RAINPULSE_NATS_USER:?set RAINPULSE_NATS_USER in deploy/.env}:${RAINPULSE_NATS_PASSWORD:?set RAINPULSE_NATS_PASSWORD in deploy/.env}@nats:4222"
      RAINPULSE_OBJECT_STORE_ENDPOINT: http://minio:9000
      RAINPULSE_OBJECT_STORE_ACCESS_KEY: "${RAINPULSE_MINIO_WORKER_ACCESS_KEY:?set RAINPULSE_MINIO_WORKER_ACCESS_KEY in deploy/.env}"
      RAINPULSE_OBJECT_STORE_SECRET_KEY: "${RAINPULSE_MINIO_WORKER_SECRET_KEY:?set RAINPULSE_MINIO_WORKER_SECRET_KEY in deploy/.env}"
      RAINPULSE_MAX_INPUT_ARTIFACT_BYTES: "${RAINPULSE_MAX_INPUT_ARTIFACT_BYTES:-2147483648}"
      RAINPULSE_WORKER_HEALTH_ADDR: "0.0.0.0:8091"
      RAINPULSE_WORKER_ID: rp016-hybrid-grid
      RAINPULSE_WORKER_PROFILE: radar-grid-hybrid
      RAINPULSE_RADAR_GRID_CONFIG: /opt/rainpulse/configs/gridding/rp040-hybrid-qc-v3.yaml
      RAINPULSE_GRID_CONFIG: /opt/rainpulse/configs/grids/fuzhou-0p01deg-v1.yaml
      RAINPULSE_ANCILLARY_CONFIG: /opt/rainpulse/configs/ancillary/fujian-taiwan-v1.yaml
      RAINPULSE_ANCILLARY_ROOT: /opt/rainpulse/ancillary
      RAINPULSE_RADAR_CONFIG_DIR: "${RAINPULSE_RADAR_CONFIG_DIR:-/opt/rainpulse/configs/radars}"
      RAINPULSE_QC_FLAG_DEFINITIONS: /opt/rainpulse/configs/qc/flag-definitions.yaml
      TZ: UTC
    volumes:
      - ../configs:/opt/rainpulse/configs:ro
      - ${RAINPULSE_ANCILLARY_ROOT:-../runtime/ancillary/assets}:/opt/rainpulse/ancillary:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=2))['profile'] == 'radar-grid-hybrid'"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  radar-mosaic-worker:
    image: rainpulse-radar-mosaic-worker
    build:
      context: ..
      dockerfile: algorithms/worker.Dockerfile
    depends_on:
      nats:
        condition: service_healthy
      minio-worker-policy:
        condition: service_completed_successfully
      orchestrator:
        condition: service_healthy
    environment:
      RAINPULSE_NATS_URL: "nats://${RAINPULSE_NATS_USER:?set RAINPULSE_NATS_USER in deploy/.env}:${RAINPULSE_NATS_PASSWORD:?set RAINPULSE_NATS_PASSWORD in deploy/.env}@nats:4222"
      RAINPULSE_OBJECT_STORE_ENDPOINT: http://minio:9000
      RAINPULSE_OBJECT_STORE_ACCESS_KEY: "${RAINPULSE_MINIO_WORKER_ACCESS_KEY:?set RAINPULSE_MINIO_WORKER_ACCESS_KEY in deploy/.env}"
      RAINPULSE_OBJECT_STORE_SECRET_KEY: "${RAINPULSE_MINIO_WORKER_SECRET_KEY:?set RAINPULSE_MINIO_WORKER_SECRET_KEY in deploy/.env}"
      RAINPULSE_MAX_INPUT_ARTIFACT_BYTES: "${RAINPULSE_MAX_INPUT_ARTIFACT_BYTES:-2147483648}"
      RAINPULSE_WORKER_HEALTH_ADDR: "0.0.0.0:8091"
      RAINPULSE_WORKER_ID: rp016-qi-mosaic
      RAINPULSE_WORKER_PROFILE: analysis-mosaic-qi
      RAINPULSE_RADAR_MOSAIC_CONFIG: /opt/rainpulse/configs/mosaic/rp040-fujian-four-radar-qc-v2.yaml
      RAINPULSE_GRID_CONFIG: /opt/rainpulse/configs/grids/fuzhou-0p01deg-v1.yaml
      RAINPULSE_QC_FLAG_DEFINITIONS: /opt/rainpulse/configs/qc/flag-definitions.yaml
      TZ: UTC
