global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rainpulse-alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: rainpulse-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8080]
  - job_name: rainpulse-orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: [orchestrator:8090]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [minio:9000]
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
