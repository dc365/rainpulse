groups:
  - name: rainpulse-control-plane
    rules:
      - alert: RainPulseControlPlaneDown
        expr: up{job=~"rainpulse-api|rainpulse-orchestrator"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: RainPulse control-plane component is unavailable
      - alert: RainPulseRadarDataStale
        expr: max(rainpulse_radar_data_delay_seconds{lifecycle="ready"}) > 600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A business-enabled radar has no volume newer than ten minutes
      - alert: RainPulseRadarDataMissing
        expr: min(rainpulse_radar_latest_scan_available{lifecycle="ready"}) < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A business-enabled radar has no registered volume evidence
      - alert: RainPulseRadarScanIncomplete
        expr: min(rainpulse_radar_scan_completeness{lifecycle="ready"}) < 0.97
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A business-enabled radar remains below the engineering completeness threshold
      - alert: RainPulseRadarQualityLow
        expr: min(rainpulse_radar_qi_mean{lifecycle="ready"}) < 0.50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A business-enabled radar remains below the engineering mean-QI threshold
      - alert: RainPulseRadarInterferenceHigh
        expr: max(rainpulse_radar_interference_ratio{lifecycle="ready"}) > 0.02
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Radial interference remains elevated on a business-enabled radar
      - alert: RainPulseAnalysisCoverageLow
        expr: min(rainpulse_analysis_valid_coverage_ratio{operational_eligible="true"}) < 0.50
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: A publication-eligible analysis remains below the engineering coverage threshold
      - alert: RainPulseAnalysisPublishDelayHigh
        expr: max(rainpulse_analysis_publish_delay_seconds{operational_eligible="true"}) > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A publication-eligible analysis exceeds the engineering publication-delay threshold
      - alert: RainPulseJobStuck
        expr: max(rainpulse_oldest_pending_job_seconds) > 600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A RainPulse job has been pending or running for over ten minutes
      - alert: RainPulseOutboxFailure
        expr: max(rainpulse_outbox_events{status="failed"}) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: RainPulse has outbox events awaiting a publish retry
