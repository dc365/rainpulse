groups:
  - name: rainpulse-control-plane
    rules:
      - alert: RainPulseControlPlaneDown
        expr: up{job=~"rainpulse-api|rainpulse-orchestrator"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: RainPulse control-plane component is unavailable
      - alert: RainPulseRadarDataStale
        expr: max by (radar_id, lifecycle) (rainpulse_radar_data_delay_seconds{lifecycle="ready"}) > 600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A business-enabled radar has no volume newer than ten minutes
      - alert: RainPulseRadarDataMissing
        expr: min by (radar_id, lifecycle) (rainpulse_radar_latest_scan_available{lifecycle="ready"}) < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A business-enabled radar has no registered volume evidence
      - alert: RainPulseRadarScanIncomplete
        expr: min by (radar_id, lifecycle) (rainpulse_radar_scan_completeness{lifecycle="ready"}) < 0.97
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A business-enabled radar remains below the engineering completeness threshold
      - alert: RainPulseRadarQualityLow
        expr: min by (radar_id, lifecycle) (rainpulse_radar_qi_mean{lifecycle="ready"}) < 0.50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A business-enabled radar remains below the engineering mean-QI threshold
      - alert: RainPulseRadarInterferenceHigh
        expr: max by (radar_id, lifecycle) (rainpulse_radar_interference_ratio{lifecycle="ready"}) > 0.02
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Radial interference remains elevated on a business-enabled radar
      - alert: RainPulseAnalysisCoverageLow
        expr: min(rainpulse_analysis_valid_coverage_ratio{operational_eligible="true"}) < 0.50
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: A publication-eligible analysis remains below the engineering coverage threshold
      - alert: RainPulseAnalysisPublishDelayHigh
        expr: max(rainpulse_analysis_publish_delay_seconds{operational_eligible="true"}) > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A publication-eligible analysis exceeds the engineering publication-delay threshold
      - alert: RainPulseJobStuck
        expr: max by (job_id, run_id, job_type, status) (rainpulse_job_active_seconds) > 600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A RainPulse job has been pending or running for over ten minutes
      - alert: RainPulseJobFailed
        expr: time() - rainpulse_job_failure_timestamp_seconds < 1800
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A RainPulse job failed within the last thirty minutes
      - alert: RainPulseOutboxFailure
        expr: max by (event_id, aggregate_id, event_type, subject) (rainpulse_outbox_event_pending_seconds) > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: RainPulse has outbox events awaiting a publish retry
      - alert: RainPulseStorageMetricsDown
        expr: up{job=~"minio|node-exporter"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: RainPulse storage capacity metrics are unavailable
      - alert: RainPulseHostDiskSpaceLow
        expr: min by (instance, mountpoint) (node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"} / node_filesystem_size_bytes{job="node-exporter",mountpoint="/"}) < 0.15 and min by (instance, mountpoint) (node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"} / node_filesystem_size_bytes{job="node-exporter",mountpoint="/"}) >= 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: RainPulse host root filesystem has less than fifteen percent free space
      - alert: RainPulseHostDiskSpaceCritical
        expr: min by (instance, mountpoint) (node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"} / node_filesystem_size_bytes{job="node-exporter",mountpoint="/"}) < 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: RainPulse host root filesystem has less than five percent free space
      - alert: RainPulseObjectStoreSpaceLow
        expr: min by (instance) (minio_cluster_capacity_usable_free_bytes{job="minio"} / minio_cluster_capacity_usable_total_bytes{job="minio"}) < 0.15 and min by (instance) (minio_cluster_capacity_usable_free_bytes{job="minio"} / minio_cluster_capacity_usable_total_bytes{job="minio"}) >= 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: RainPulse object storage has less than fifteen percent usable capacity free
      - alert: RainPulseObjectStoreSpaceCritical
        expr: min by (instance) (minio_cluster_capacity_usable_free_bytes{job="minio"} / minio_cluster_capacity_usable_total_bytes{job="minio"}) < 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: RainPulse object storage has less than five percent usable capacity free
